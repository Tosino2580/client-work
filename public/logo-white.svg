<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="560" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
      .brand-title-white {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.5px;
        fill: #FFFFFF;
      }
      .brand-subtitle-white {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 3.6px;
        fill: #e28775;
      }
    </style>
    <filter id="emblem-shadow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Emblem (White background) -->
  <g transform="translate(8, 7)">
    <circle cx="28" cy="28" r="28" fill="#FFFFFF" filter="url(#emblem-shadow-white)" />
    
    <g transform="translate(28, 28) scale(0.42) translate(-50, -50)" fill="none" stroke="#121316" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M50 20 C50 38 32 46 22 58 C16 65 19 78 30 80 C40 82 46 72 50 64 C54 72 60 82 70 80 C81 78 84 65 78 58 C68 46 50 38 50 20 Z"
        fill="#121316"
        fill-opacity="0.14"
      />
      <path d="M50 24 V65" stroke="#121316" stroke-width="4" />
      <path d="M50 44 C42 48 34 54 30 64" stroke="#121316" />
      <path d="M50 44 C58 48 66 54 70 64" stroke="#121316" />
      <circle cx="50" cy="20" r="4" fill="#121316" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(76, 0)">
    <text x="0" y="38" class="brand-title-white">Kasie</text>
    <text x="1" y="55" class="brand-subtitle-white">BODYWORK</text>
  </g>
</svg>
