<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Circular Emblem -->
  <circle cx="50" cy="50" r="46" fill="#121316" filter="url(#shadow)" />
  
  <!-- Inner Lotus / Crown Monogram Motif -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lotus Petal Silhouette with gentle fill -->
    <path
      d="M50 20 C50 38 32 46 22 58 C16 65 19 78 30 80 C40 82 46 72 50 64 C54 72 60 82 70 80 C81 78 84 65 78 58 C68 46 50 38 50 20 Z"
      fill="#FFFFFF"
      fill-opacity="0.14"
    />
    <!-- Center Stem -->
    <path d="M50 24 V65" stroke="#FFFFFF" stroke-width="3" />
    <!-- Left Curve -->
    <path d="M50 44 C42 48 34 54 30 64" stroke="#FFFFFF" />
    <!-- Right Curve -->
    <path d="M50 44 C58 48 66 54 70 64" stroke="#FFFFFF" />
    <!-- Top Crown Jewel / Seed -->
    <circle cx="50" cy="20" r="3" fill="#FFFFFF" />
  </g>
</svg>
